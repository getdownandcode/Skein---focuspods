name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: focuspods
          POSTGRES_PASSWORD: focuspods
          POSTGRES_DB: focuspods_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U focuspods -d focuspods_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://focuspods:focuspods@localhost:5432/focuspods_test
      JWT_SECRET: ci-secret-that-is-at-least-32-characters
      GOOGLE_CLIENT_IDS: ci-test.apps.googleusercontent.com
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
